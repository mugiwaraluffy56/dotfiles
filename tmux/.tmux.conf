# ─────────────────────────────────────────────────────
#  Spider-Verse tmux — deep black, vivid red, electric blue
# ─────────────────────────────────────────────────────

set -g default-terminal 'tmux-256color'
set -ag terminal-overrides ',xterm-256color:RGB'

black="#0A0A15"
dark1="#0F0F20"
dark2="#16162A"
dark3="#1E1E35"
muted="#383850"
silver="#C0C0C0"
dimblue="#4A4A7A"
red="#FF1744"
blue="#2979FF"
darkblue="#0D2B8A"
white="#FFFFFF"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -g escape-time 0
set -g focus-events on
set -g status-interval 2
set -g set-clipboard on

unbind C-b
unbind C-a
set -g prefix C-g
bind C-g send-prefix

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind R source-file ~/.tmux.conf \; display-message " Config reloaded"

setw -g window-status-style "fg=${dimblue},bg=${black}"
setw -g window-status-format "  #I  #W  "
setw -g window-status-current-style "fg=${black},bg=${red},bold"
setw -g window-status-current-format "  #I  #W  "
setw -g window-status-separator ""

set -g pane-border-style "fg=${dark3}"
set -g pane-active-border-style "fg=${red}"
set -g pane-border-lines heavy
set -g pane-border-indicators colour

set -g message-style "fg=${black},bg=${blue},bold"
set -g message-command-style "fg=${white},bg=${darkblue}"

set -g status on
set -g status-position bottom
set -g status-style "fg=${silver},bg=${dark1}"
set -g status-left-length 50
set -g status-right-length 120

set -g status-left "#[fg=${black},bg=${red},bold]  #S #[fg=${red},bg=${dark1},nobold]"
set -g status-right "#[fg=${muted},bg=${dark1}]#[fg=${dimblue},bg=${dark2}]#{?client_prefix,#[fg=${red}]  ,}#[fg=${blue},bg=${dark2},bold] %H:%M#[fg=${dimblue},bg=${dark2},nobold]:%S #[fg=${dark2},bg=${dark1}]#[fg=${dimblue},bg=${dark1}]  %a %d %b "

setw -g mode-keys vi
setw -g mode-style "fg=${black},bg=${red}"
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Run Claude Code in a separate session
bind -r p run-shell '\
  SESSION="claude-$(echo #{pane_current_path} | md5sum | cut -c1-8)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude"; \
  tmux display-popup -w80% -h80% -E "tmux attach-session -t $SESSION"'
